
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamento - Imperium Auto Center</title>

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <header>
        <h1>IMPERIUM AUTO CENTER</h1>

        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="index.html#servicos">Serviços</a></li>
                <li><a href="form.html">Orçamento</a></li>
                <li><a href="about.html">Sobre nós</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h2>Agendamento de serviços</h2>

        <p>Preencha os dados abaixo para solicitar um serviço.</p>

        <form action="formAction.html" method="GET">

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome"
                placeholder="Digite seu nome completo"
                required minlength="3">
            <br><br>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone"
                placeholder="(00) 00000-0000"
                required pattern="[0-9() +-]{10,20}">
            <br><br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email"
                placeholder="exemplo@email.com"
                required>
            <br><br>

            <label for="veiculo">Modelo do veículo:</label>
            <input type="text" id="veiculo" name="veiculo"
                placeholder="Ex: Honda Civic"
                required minlength="2">
            <br><br>

            <label for="placa">Placa do veículo:</label>
            <input type="text" id="placa" name="placa"
                placeholder="ABC1D23"
                required pattern="[A-Za-z]{3}[0-9][A-Za-z0-9][0-9]{2}"
                title="Digite uma placa válida, no formato ABC1234 ou ABC1D23">
            <br><br>

            <label for="servico">Tipo de serviço:</label>
            <select id="servico" name="servico" required>
                <option value="">Selecione um serviço</option>
                <option value="Revisão">Revisão</option>
                <option value="Freios">Freios</option>
                <option value="Motor">Motor</option>
                <option value="Suspensão">Suspensão</option>
                <option value="Outros">Outros</option>
            </select>
            <br><br>

            <label for="descricao">Descrição do problema:</label>
            <br>

            <textarea id="descricao" name="descricao"
                placeholder="Descreva o problema do veículo"
                required minlength="10" rows="5" cols="40"></textarea>

            <br><br>

            <button type="submit">Enviar formulário</button>
            <button type="reset">Limpar campos</button>

        </form>

    </main>

    <footer>
        <p>© 2026 Imperium Auto Center</p>
        <p>Projeto acadêmico - PUC PR.</p>
    </footer>

</body>
</html>
